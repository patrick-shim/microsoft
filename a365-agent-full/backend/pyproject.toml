[project]
name = "a365-agent-full"
version = "0.1.0"
description = "Microsoft Agent 365 AI Teammate — Agent Framework + WorkIQ + observability, hosted for Teams"
authors = [{ name = "Microsoft", email = "support@microsoft.com" }]
requires-python = ">=3.11"

dependencies = [
    # ── Microsoft Agent Framework (the LLM/agent runtime) ─────────────────────
    # Pinned to the same 1.11 train the working a365-agent-slim uses, where
    # `agent_framework.openai.OpenAIChatClient(azure_endpoint=..., credential=...)`
    # is the verified Azure OpenAI path. `agent-framework-azure-ai` (the deprecated
    # Azure OpenAI client) is intentionally NOT used — its build drags in an
    # incompatible core pin. See backend/agent.py `_create_chat_client`.
    "agent-framework==1.11.0",
    "agent-framework-core==1.11.0",
    "agent-framework-openai==1.10.1",

    # ── Microsoft Agents SDK — hosting + integration (Bot Framework layer) ─────
    "microsoft-agents-hosting-aiohttp>=1.0.0",
    "microsoft-agents-hosting-core",
    "microsoft-agents-authentication-msal",
    "microsoft-agents-activity",

    # ── Azure SDK ─────────────────────────────────────────────────────────────
    "azure-identity",

    # ── Core runtime ──────────────────────────────────────────────────────────
    "python-dotenv",
    "aiohttp",
    "uvicorn[standard]>=0.20.0",
    "httpx>=0.28.1",
    "pydantic>=2.0.0",
    "typing-extensions>=4.0.0",
    "wrapt>=1.15.0",

    # ── Microsoft Agent 365 SDK (GA 1.0.0) ────────────────────────────────────
    "microsoft-agents-a365-runtime>=1.0.0",
    "microsoft-agents-a365-notifications>=1.0.0",
    "microsoft-agents-a365-observability-core>=1.0.0",
    "microsoft-agents-a365-observability-hosting>=1.0.0",
    "microsoft-agents-a365-tooling>=1.0.0",
    # WorkIQ MCP adapter for Agent Framework (parity with .NET IMcpToolRegistrationService)
    "microsoft-agents-a365-tooling-extensions-agentframework>=1.0.0",

    # ── Observability distro (single canonical entry point) ───────────────────
    "microsoft-opentelemetry>=1.2.0",
]

# PyPI primary; allow pre-releases so the A365 packages resolve to latest when needed.
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.uv]
prerelease = "allow"
dev-dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
